<!-- @dsCard height=320 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500&display=swap">
<style>
  .fw-cover {
    position: relative;
    width: 960px;
    height: 320px;
    background: var(--md-background);
    overflow: hidden;
  }
  .fw-cover svg { position: absolute; inset: 0; display: block; }

  .fw-block   { rx: var(--shape-large); }
  .fw-navy    { fill: var(--md-secondary); }
  .fw-orange  { fill: var(--md-primary-decorative); }
  .fw-sky     { fill: var(--color-sky-500); }
  .fw-tint    { fill: var(--color-rust-100); }

  .fw-tile    { rx: var(--shape-small); }
  .fw-tile-on-dark { fill: var(--md-accent-on-dark); }
  .fw-tile-on-tint { fill: var(--md-primary-decorative); }

  .fw-name {
    position: absolute;
    left: 48px;
    bottom: 92px;
    width: 432px;
    margin: 0;
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 400;
    letter-spacing: -1px;
    line-height: 0.95;
    color: var(--md-on-background);
  }
  .fw-tag {
    position: absolute;
    left: 48px;
    bottom: 48px;
    width: 432px;
    margin: 0;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.25px;
    line-height: 1.43;
    color: var(--md-text-medium);
  }
</style>

                 signature is exactly that contradiction: large surfaces squared at shape-large 0,
                 controls rounded at shape-small 4, so the slabs are studded with control-sized tiles
    scales:      tile space-4 (16), merged space-4+space-2+space-4 (40), pitch space-5 (24),

  -->
